name: Cache Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cache-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Start application
      run: npm start &
      env:
        PORT: 3000
        
    - name: Wait for application
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:3000/en; do sleep 1; done'
        
    - name: Test cache headers
      run: npm run cache:test
      
    - name: Test cache headers (multiple requests)
      run: |
        # Test cache hit rates with multiple requests
        for i in {1..5}; do
          echo "Request $i:"
          curl -I http://localhost:3000/favicon.ico
          curl -I http://localhost:3000/images/logos/Lyyli_ai_favicon.svg
          curl -I http://localhost:3000/_next/static/css/app/layout.css
          sleep 1
        done
        
    - name: Install Lighthouse CI
      run: npm run lighthouse:install
      
    - name: Run Lighthouse tests
      run: npm run lighthouse:test
      continue-on-error: true
      
    - name: Upload Lighthouse reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lighthouse-reports
        path: lighthouse-reports/
        
    - name: Cache test results
      run: |
        echo "## Cache Test Results" >> $GITHUB_STEP_SUMMARY
        echo "✅ Cache headers configured for static assets" >> $GITHUB_STEP_SUMMARY
        echo "✅ ETag headers implemented" >> $GITHUB_STEP_SUMMARY
        echo "✅ Compression enabled (Brotli/Gzip)" >> $GITHUB_STEP_SUMMARY
        echo "✅ Long-term caching for immutable assets" >> $GITHUB_STEP_SUMMARY
