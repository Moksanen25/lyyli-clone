name: Web Vitals Budget Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  web-vitals-budget:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright
      run: npx playwright install chromium
      
    - name: Build application
      run: npm run build
      
    - name: Start development server
      run: npm start &
      
    - name: Wait for server to be ready
      run: npx wait-on http://localhost:3000 --timeout 60000
      
    - name: Run Web Vitals budget check
      run: node scripts/web-vitals-budget.mjs
      
    - name: Upload Web Vitals report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: web-vitals-report
        path: web-vitals-report.json
        retention-days: 30

  lighthouse-audit:
    runs-on: ubuntu-latest
    needs: web-vitals-budget
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Start development server
      run: npm start &
      
    - name: Wait for server to be ready
      run: npx wait-on http://localhost:3000 --timeout 60000
      
    - name: Run Lighthouse audit
      run: |
        npm install -g lighthouse
        lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-report.json --chrome-flags="--headless"
        
    - name: Extract Lighthouse scores
      run: |
        node -e "
        const report = require('./lighthouse-report.json');
        const scores = {
          performance: Math.round(report.categories.performance.score * 100),
          accessibility: Math.round(report.categories.accessibility.score * 100),
          'best-practices': Math.round(report.categories['best-practices'].score * 100),
          seo: Math.round(report.categories.seo.score * 100)
        };
        console.log('Lighthouse Scores:', JSON.stringify(scores, null, 2));
        
        // Check if scores meet minimum thresholds
        const thresholds = { performance: 90, accessibility: 95, 'best-practices': 90, seo: 90 };
        let failed = false;
        for (const [category, score] of Object.entries(scores)) {
          if (score < thresholds[category]) {
            console.error(\`❌ \${category}: \${score} < \${thresholds[category]}\`);
            failed = true;
          } else {
            console.log(\`✅ \${category}: \${score} >= \${thresholds[category]}\`);
          }
        }
        if (failed) process.exit(1);
        "
        
    - name: Upload Lighthouse report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lighthouse-report
        path: lighthouse-report.json
        retention-days: 30
